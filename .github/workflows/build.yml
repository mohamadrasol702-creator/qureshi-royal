name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get nodejs-mobile
        run: |
          set -e
          curl -fL -o nm.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          unzip -q nm.zip -d nm
          mkdir -p app/libnode/bin/arm64-v8a app/libnode/include
          SO="$(find nm -path '*arm64-v8a*' -name libnode.so | head -1)"
          H="$(find nm -name node.h | head -1)"
          test -n "$SO" || { echo "libnode.so NOT FOUND"; exit 1; }
          test -n "$H" || { echo "node.h NOT FOUND"; exit 1; }
          cp "$SO" app/libnode/bin/arm64-v8a/
          cp -r "$(dirname "$H")" app/libnode/include/node
          ls -la app/libnode/bin/arm64-v8a/

      - name: Bundle bot engine
        run: |
          set -e
          cd server
          npm install --omit=dev --no-audit --no-fund
          test -d node_modules/@whiskeysockets/baileys || { echo "baileys missing"; exit 1; }
          mkdir -p ../app/src/main/assets
          zip -qr ../app/src/main/assets/nodejs-project.zip . -x "*/.bin/*" ".env*" "ecosystem.config.js"
          unzip -l ../app/src/main/assets/nodejs-project.zip | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: QureshiRoyal-APK
          path: app/build/outputs/apk/debug/*.apk
